name: Tests

# Minimal Linux core CI: a source install (bundled Rust extensions), pip check, CLI help, and the interface,
# installer and regression tests that need no GPU, Docling, OCR models or network.
on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Rust toolchain from rust-toolchain.toml
        run: |
          rustup toolchain install
          rustc --version

      - name: Install glossAPI from source
        run: |
          python -m pip install pip==26.2.2
          python -m pip install .
          python -m pip check

      - name: Install the test tools
        # The test group's pinned reference oracles (old scikit-learn, dask, ...) are not needed by these tests.
        run: python -m pip install 'pytest>=9.2.0,<10' 'fpdf2>=2.7.0' 'jsonschema>=4.23,<5'

      - name: CLI
        run: |
          glossapi --help
          for command in plan run status report capabilities doctor install guide; do
            glossapi "$command" --help > /dev/null
          done
          glossapi capabilities --json > /dev/null

      - name: Interface, installer and regression tests
        # The src/ layout keeps the checkout's sources off sys.path: the installed package is the one under test.
        run: |
          python -m pytest -q -rs -p no:cacheprovider \
            tests/test_k3_interface.py tests/test_k3b_interface.py tests/test_k3f_fixes.py \
            tests/test_k2_declarations.py tests/test_install_glossapi.py \
            tests/test_ledger_w18_barriers.py tests/test_corpus_phases_lightweight.py \
            tests/test_release_020_fixes.py
