[build-system]
requires = ["setuptools>=69", "wheel", "setuptools-rust>=1.9,<2"]
build-backend = "setuptools.build_meta"

[project]
name = "glossapi"
version = "0.1.4"
description = "Academic document processing pipeline with Rust-powered markdown cleaning"
authors = [
    {name = "GlossAPI Team", email = "glossapi.team@eellak.gr"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=1.3.0",
    "numpy>=1.26,<3",
    "pyarrow>=7.0.0",
    "ftfy>=6.0.0",
    "pypdfium2>=4.30,<5",
    "zstandard>=0.22.0",
    "filelock>=3.0",
]
license = "EUPL-1.2"
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
]

[project.optional-dependencies]
download = [
    "aiohttp>=3.8.0",
    "aiofiles>=23.0.0",
    "tenacity>=8.0.0",
    "pyyaml>=6.0",
]
browser = [
    "glossapi[download]",
    "playwright>=1.52,<2",
    "Pillow>=10",
]
layout = [
    "docling==2.81.0",
]
# Compatibility alias for existing installer profiles.
docling = ["glossapi[layout]"]
annotate = [
    # Existing serialized section classifier requires this version.
    "scikit-learn==1.6.1",
    "joblib>=1.0.0",
    "dask[dataframe]>=2022.1.0",
]
# Explicit diagnostic reference; native repair is included in the core wheel.
font-repair = ["pypdf>=6.0.0", "fonttools>=4.0.0"]
cuda = ["torch==2.5.1", "torchvision==0.20.1"]
docs = ["mkdocs>=1.5", "mkdocs-material>=9.5"]

[dependency-groups]
test = [
    "pytest>=8.0",
    "fpdf2>=2.7.0",
    "pypdf>=6.0.0",
    "fonttools>=4.0.0",
    "psutil>=5.9",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["glossapi", "glossapi.*"]

[tool.setuptools.package-data]
glossapi = ["models/**/*"]

[tool.pytest.ini_options]
markers = [
    "linux_dev_node: Linux-only deployment resource gate; run on the dev node",
    "slow: explicit local CPU cohort integration run",
]

# Bundle the three core extensions so `uv pip install .` needs no second installer.
[[tool.setuptools-rust.ext-modules]]
target = "glossapi_rs_cleaner"
path = "rust/glossapi_rs_cleaner/Cargo.toml"
binding = "PyO3"
py-limited-api = "auto"

[[tool.setuptools-rust.ext-modules]]
target = "glossapi_rs_noise"
path = "rust/glossapi_rs_noise/Cargo.toml"
binding = "PyO3"
py-limited-api = "auto"

[[tool.setuptools-rust.ext-modules]]
target = "glossapi_rs_pdfrepair"
path = "rust/glossapi_rs_pdfrepair/Cargo.toml"
binding = "PyO3"
py-limited-api = "auto"
